seed: 42
device: auto

datasets:
  pubfig:
    root: data/raw/pubfig
    image_size: 224
    num_classes: 62
    minimum_patch_size: 12
  lfw:
    root: data/raw/lfw
    image_size: 224
    num_classes: 62
    minimum_patch_size: 12
  pins:
    root: data/raw/pins
    image_size: 224
    num_classes: 105
    minimum_patch_size: 12
  cifar10:
    root: data/raw/cifar10
    image_size: 64
    num_classes: 10
    minimum_patch_size: 8

backbones:
  - resnet18
  - resnet34

defenses:
  raw:
    enabled: false
    rho: 0.0
    donors: 0
  defense_a:
    enabled: true
    rho: 0.8
    donors: 2
  defense_b:
    enabled: true
    rho: 0.6
    donors: 2
  defense_c:
    enabled: true
    rho: 0.8
    donors: 3
  defense_d:
    enabled: true
    rho: 0.8
    donors: 4

permutation:
  grid_size: 8
  codebook_size: 64
  root_key_suffix: reproduction_key_v1

federated:
  clients: 5
  rounds: 50
  local_epochs: 3
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  dirichlet_alpha: 0.5
  confidence_penalty_weight: 0.0

evaluation:
  validation_fraction: 0.2
  temperature_scaling: true
  inversion_targets: 10
  inversion_restarts: 10
  inversion_iterations: 400
