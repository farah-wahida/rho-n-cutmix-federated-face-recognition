[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rho-n-cutmix-federated-face-recognition"
version = "0.1.0"
description = "Input-level privacy pipeline for federated face recognition."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Farah Wahida" },
  { name = "Ibrahim Khalil" }
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scikit-image>=0.22",
  "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
