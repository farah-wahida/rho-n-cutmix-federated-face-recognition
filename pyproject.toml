[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rho-n-cutmix-federated-face-recognition"
version = "1.0.0"
description = "Publication release for the rho-n CutMix federated face-recognition privacy pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Farah Wahida" },
  { name = "Ibrahim Khalil" }
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scikit-image>=0.22",
  "matplotlib>=3.8"
]

[project.urls]
Paper = "https://doi.org/10.1109/TBIOM.2026.3725635"
Repository = "https://github.com/farah-wahida/rho-n-cutmix-federated-face-recognition"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
